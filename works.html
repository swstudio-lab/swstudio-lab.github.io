<footer>
    made with care · updated as things get made

<script src="assets/icons.js"></script>
<script src="assets/listing.js"></script>
<script>
const col = db.collection('siteItems');
const PAGE_SIZE = 6;
let page = 1;

function renderAll(allItems){
    const items = allItems.filter(it => it.category==='works' && it.published).sort((a,b)=>(a.order||0)-(b.order||0));
    page = renderListingGrid({
        items, page, pageSize: PAGE_SIZE,
        gridEl: document.getElementById('items-grid'),
        pagEl: document.getElementById('items-pagination'),
        onPageChange: newPage => { page = newPage; renderAll(allItems); }
    });
}

col.onSnapshot(snap => {
    const allItems = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    renderAll(allItems);
});
</script>
